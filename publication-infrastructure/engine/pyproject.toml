[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenetism-publication-engine"
version = "2.0.0a4"
description = "Publication Engine v2 Stage 1 and Sandbox-only Stages 2A and 2B"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zenetism-publication = "zenetism_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zenetism_engine*"]
